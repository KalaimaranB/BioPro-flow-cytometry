[project]
name = "flow_cytometry"
version = "0.8.3.1"
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
  { name = "Kalaimaran Balasothy" },
]
dependencies = [
    "msgpack>=1.0.0, <2.0.0",
    "numpy==1.26.4",
    "pandas==3.0.3",
    "matplotlib==3.11.0",
    "scipy==1.17.1",
    "flowkit==1.2.3",
    "fcsparser==0.2.8",
    "flowutils==1.1.0",
    "flowio==1.3.0",
    "scikit-learn==1.9.0",
    "threadpoolctl>=3.6.0, <4.0.0",
    "umap-learn==0.5.12",
    "hdbscan==0.8.44",
    "seaborn==0.13.2",
    "fast-histogram==0.14",
    "pillow>=12.3.0, <13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0, <9.0",
    "pytest-qt>=4.3, <5.0",
    "pytest-cov>=4.1, <5.0",
    "ruff>=0.16, <1.0",
    "mypy>=1.9, <2.0",
    "pip-audit>=2.7, <3.0",
    "pre-commit>=3.6, <4.0",
]

[tool.biopro.plugin]
id = "flow_cytometry"
display_name = "Flow Cytometry"
min_core_version = "1.5.1"
entry_point = "biopro_plugins.flow_cytometry:initialize"
is_beta = true
requires = ["task_scheduler", "logger", "event_bus"]
tags = ["flow cytometry", "gating", "FMO", "compensation", "FCS", "UMAP", "bioinformatics"]
homepage = "https://github.com/KalaimaranB/BioPro-flow-cytometry"
description = """
A high-performance flow cytometry analysis workspace for BioPro. \
Features true Logicle transforms, automated spillover compensation, hierarchical gating, \
UMAP dimensionality reduction, spectral unmixing, comprehensive statistics, and reproducible workflow pipelines.\
"""
authors = [
  { name = "Kalaimaran Balasothy", role = "Lead Developer", permissions = ["sign_code"], github = "KalaimaranB", avatar_url = "https://avatars.githubusercontent.com/u/166263319?v=4", details = "Biomedical Engineering student (Bioinformatics & Cellular Engineering) at UBC. Lead architect of BioPro, specializing in cellular informatics, multi-dimensional lab data processing, and software automation." },
]
contributors = [
  { name = "Sreeparna Vappala", role = "Scientific Advisor", details = "Lecturer, Department of Microbiology and Immunology, UBC. Expertise in cell biology, immunology, and science education pedagogy." },
  { name = "Kabir Bhalla", role = "Scientific Advisor", details = "PhD Candidate, Microbiology & Immunology, UBC. Research focus: polyphosphate contribution to Cryptococcal disease. CGS-D & Four Year Doctoral Fellow."},
  { name = "Cynthia Chung", role = "Scientific Advisor", details = "PhD Candidate, Microbiology & Immunology, UBC. Research focus: age-dependent effects of gammaherpesvirus-68 on autoimmune development in multiple sclerosis mouse models."},
]

[tool.biopro.plugin.signing]
# Author's Ed25519 public key — trust root: BioPro Core Authority → Kalaimaran Balasothy
# Verified by trust_chain.json (signature issued by biopro_core authority)
author_public_key = "8c1f68355afe0e8861bad31e28df6087330483ed65bbcabcc0745ebaac7d1a33"

# Delegated keys: author signs for these identities (e.g. CI/CD bots)
# Verified by delegation.json (signature issued by author)
[[tool.biopro.plugin.signing.delegated_keys]]
name = "BioPro Flow Cytometry CI Pipeline"
public_key = "8041339e37e37179b6e949bdc13b657c92b989b5d382ef78ec52772787de7c7e"
signed_by = "Kalaimaran Balasothy"
role = "ci_runner"


# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests (fast, headless)",
    "functional: functional/integration tests",
    "slow: slow running tests",
    "edge_case: edge case tests",
    "ui: tests that require Qt/display",
    "integration: integration tests",
]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Third-party packages without bundled type stubs
module = [
    "PyQt6.*",
    "numpy.*",
    "scipy.*",
    "pandas.*",
    "matplotlib.*",
    "sklearn.*",
    "umap.*",
    "hdbscan.*",
    "seaborn.*",
    "flowkit.*",
    "fcsparser.*",
    "flowutils.*",
    "flowio.*",
    "fast_histogram.*",
    "mpl_toolkits.*",
    "msgpack.*",
    "threadpoolctl.*",
    "biopro_sdk.*",
    "biopro.*",
    "sip.*",
]
ignore_missing_imports = true

[tool.uv.sources]
biopro-sdk = { path = "../BioPro-SDK" }

[dependency-groups]
dev = [
    "biopro-sdk",
    "pyqt6>=6.11.0, <7.0.0",
]
