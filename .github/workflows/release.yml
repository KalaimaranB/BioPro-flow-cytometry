name: Auto-Release Plugin

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check_version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      plugin_id: ${{ steps.check.outputs.plugin_id }}
      release_notes: ${{ steps.check.outputs.release_notes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Version
        id: check
        run: |
          python -c "
          import sys
          if sys.version_info >= (3, 11):
              import tomllib as toml
          else:
              import toml

          with open('pyproject.toml', 'rb') as f:
              data = toml.load(f)

          project = data.get('project', {})
          plugin = data.get('tool', {}).get('karcytics', {}).get('plugin', {})

          plugin_id = plugin.get('id', '')
          version = project.get('version', '')
          release_notes = plugin.get('release_notes', 'No release notes provided.')

          import os
          import uuid

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'plugin_id={plugin_id}\n')
              f.write(f'version={version}\n')

              eof_marker = str(uuid.uuid4())
              f.write(f'release_notes<<{eof_marker}\n')
              f.write(f'{release_notes}\n')
              f.write(f'{eof_marker}\n')
          "
          # Get variables to check if tag exists
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_NAME="v$VERSION"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
            echo "Version $VERSION already released. Skipping build."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "New version $VERSION detected. Proceeding with release."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  lint-and-audit:
    name: Lint, Types & Security (Ubuntu)
    needs: check_version
    if: needs.check_version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.2.2
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Checkout Karcytics-SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KalaimaranB/Karcytics-SDK
          path: Karcytics-SDK
          persist-credentials: false

      - name: Install dependencies
        run: |
          python3 -c "import sys; c=open('pyproject.toml').read(); open('pyproject.toml','w').write(c.replace('\"../Karcytics-SDK\"', '\"./Karcytics-SDK\"'))"
          uv sync --all-extras
        shell: bash

      - name: Ruff — Lint
        run: uv run ruff check src/ tests/
        shell: bash

      - name: Ruff — Format check
        run: uv run ruff format --check src/ tests/
        shell: bash

      - name: Mypy — Type check (analysis strict, UI suppressed)
        run: uv run mypy --explicit-package-bases src/
        shell: bash

      - name: pip-audit — Security vulnerability scan
        run: |
          uv export --format requirements-txt --no-emit-project | grep -v "^-e " | grep -v "Karcytics-SDK" > reqs.txt
          uv run --with pip-audit pip-audit -r reqs.txt --no-deps --disable-pip \
            --ignore-vuln CVE-2025-69872
        shell: bash

  test:
    name: Tests (${{ matrix.os }})
    needs: [check_version, lint-and-audit]
    if: needs.check_version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.2.2
        with:
          python-version: "3.11"
          enable-cache: true


      - name: Checkout Karcytics-SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KalaimaranB/Karcytics-SDK
          path: Karcytics-SDK
          persist-credentials: false

      - name: Install dependencies
        run: |
          python -c "import sys; c=open('pyproject.toml').read(); open('pyproject.toml','w').write(c.replace('\"../Karcytics-SDK\"', '\"./Karcytics-SDK\"'))"
          uv sync --all-extras
        shell: bash

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash

  release:
    name: Evaluate, Sign & Release
    needs: [check_version, test]
    if: needs.check_version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tag Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v${{ needs.check_version.outputs.version }}"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Karcytics SDK
        run: |
          uv pip install --system git+https://github.com/KalaimaranB/Karcytics-SDK.git

      - name: SDK Evaluate Plugin
        run: |
          karcytics-sdk evaluate .
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Execute Project Signing
        run: |
          karcytics-sdk project-sign . --delegation .ci_keys/runner_delegation.json
        env:
          KARCYTICS_PROJECT_PRIVATE_KEY: ${{ secrets.KARCYTICS_PROJECT_PRIVATE_KEY }}
          QT_QPA_PLATFORM: offscreen

      - name: Build Release ZIP
        run: |
          PLUGIN_ID="${{ needs.check_version.outputs.plugin_id }}"
          NEW_VERSION="${{ needs.check_version.outputs.version }}"
          ZIP_NAME="${PLUGIN_ID}_v${NEW_VERSION}.zip"

          zip -r "$ZIP_NAME" . \
            --exclude "*.git*" \
            --exclude "*tests/*" \
            --exclude "*__pycache__/*" \
            --exclude "*.venv/*" \
            --exclude "*.plugin_venv/*" \
            --exclude "*.DS_Store" \
            --exclude "*.pem" \
            --exclude "*.key" \
            --exclude "*.pytest_cache/*" \
            --exclude "*.github/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check_version.outputs.version }}"
          name: "${{ needs.check_version.outputs.plugin_id }} v${{ needs.check_version.outputs.version }}"
          body: |
            ### Release Notes
            ${{ needs.check_version.outputs.release_notes }}

            ---
            *Auto-generated changes below:*
          generate_release_notes: true
          files: "${{ needs.check_version.outputs.plugin_id }}_v${{ needs.check_version.outputs.version }}.zip"
