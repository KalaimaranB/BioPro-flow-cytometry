name: CI — Tests & Lint

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Qt deps
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: |
          pip install -e ../BioPro-SDK   # or use the published wheel
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/unit/ tests/functional/ -v
        env:
          QT_QPA_PLATFORM: offscreen

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check analysis/ ui/ tests/
