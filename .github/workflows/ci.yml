name: CI — Lint, Type Check & Tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Job 1: Fast-fail quality gate (runs first on every push/PR) ───────────
  lint-and-audit:
    name: Lint, Types & Security (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.2.2
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Checkout BioPro-SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KalaimaranB/BioPro-SDK
          path: BioPro-SDK
          persist-credentials: false

      - name: Install dependencies
        run: |
          python3 -c "import sys; c=open('pyproject.toml').read(); open('pyproject.toml','w').write(c.replace('\"../BioPro-SDK\"', '\"./BioPro-SDK\"'))"
          uv sync --all-extras
        shell: bash

      - name: Ruff — Lint
        run: uv run ruff check src/ tests/
        shell: bash

      - name: Ruff — Format check
        run: uv run ruff format --check src/ tests/
        shell: bash

      - name: Mypy — Type check (analysis strict, UI suppressed)
        run: uv run mypy --explicit-package-bases src/
        shell: bash

      - name: pip-audit — Security vulnerability scan
        run: |
          uv export --format requirements-txt --no-emit-project | grep -v "^-e " > reqs.txt
          uv run --with pip-audit pip-audit -r reqs.txt --no-deps --disable-pip \
            --ignore-vuln CVE-2025-69872
        shell: bash

  # ── Job 2: Cross-platform tests (gated on lint-and-audit passing) ─────────
  test:
    name: Tests (${{ matrix.os }})
    needs: [lint-and-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.2.2
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install system Qt deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Checkout BioPro-SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KalaimaranB/BioPro-SDK
          path: BioPro-SDK
          persist-credentials: false

      - name: Install dependencies
        run: |
          python -c "import sys; c=open('pyproject.toml').read(); open('pyproject.toml','w').write(c.replace('\"../BioPro-SDK\"', '\"./BioPro-SDK\"'))"
          uv sync
        shell: bash

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash