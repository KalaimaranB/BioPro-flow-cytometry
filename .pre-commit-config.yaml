repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(manifest\.json|security\.json|trust_chain\.json|signature\.bin)$'
      - id: end-of-file-fixer
        exclude: '^(manifest\.json|security\.json|trust_chain\.json|signature\.bin)$'
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: pytest
        name: Run Tests
        entry: uv run pytest tests/unit/ tests/functional/ -v
        language: system
        pass_filenames: false
        always_run: true

      - id: biopro-sign
        name: BioPro SDK Sign
        entry: bash -c 'PLUGIN_ID=$(grep "\"id\"" manifest.json | head -1 | cut -d"\"" -f4); ln -sfn "$PWD" "$PWD/../$PLUGIN_ID" && biopro-sdk sign "$PWD/../$PLUGIN_ID"; rm "$PWD/../$PLUGIN_ID"'
        language: system
        pass_filenames: false
        always_run: true
