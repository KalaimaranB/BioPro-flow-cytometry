fail_fast: false
repos:
  - repo: local
    hooks:
      # ── 1. Lint (auto-fix) ────────────────────────────────────────────────
      - id: ruff-linter
        name: Ruff Linter
        entry: uv run ruff check src/ tests/ --fix
        language: system
        types_or: [python]
        pass_filenames: false
        always_run: true

      # ── 2. Format ─────────────────────────────────────────────────────────
      - id: ruff-formatter
        name: Ruff Formatter
        entry: uv run ruff format src/ tests/
        language: system
        types_or: [python]
        pass_filenames: false
        always_run: true

      # ── 3. Type check (analysis layer strict; UI suppressed via mypy config)
      - id: mypy
        name: Mypy Type Checker
        entry: uv run mypy --explicit-package-bases src/
        language: system
        pass_filenames: false

      # ── 4. Security audit ─────────────────────────────────────────────────
      - id: pip-audit
        name: Dependency Security Audit
        entry: bash -c 'uv export --format requirements-txt --no-emit-project | grep -v "^-e " | grep -v -i "karcytics" > /tmp/fc_reqs.txt && uv run --with pip-audit pip-audit -r /tmp/fc_reqs.txt --no-deps --disable-pip --ignore-vuln CVE-2025-69872'
        language: system
        pass_filenames: false

      # ── 5. Unit tests (fast, headless — functional/UI tests run in CI) ────
      - id: pytest
        name: Unit Test Suite
        entry: uv run pytest tests/unit/ --tb=short -q
        language: system
        pass_filenames: false

      # ── 6. Karcytics SDK signing ─────────────────────────────────────────────
      - id: karcytics-sign
        name: Karcytics SDK Sign
        entry: bash -c 'PLUGIN_ID=$(grep "^id =" pyproject.toml | head -1 | cut -d"\"" -f2); ln -sfn "$PWD" "$PWD/../$PLUGIN_ID" && karcytics-sdk sign "$PWD/../$PLUGIN_ID"; rm "$PWD/../$PLUGIN_ID"'
        language: system
        pass_filenames: false
        always_run: true
